name: Fetch lottery

on:
  workflow_dispatch: {}
  # GitHub delays scheduled runs by hours at busy times and drops some, most of all at
  # minutes 0/15/30/45. Odd minutes, a longer window and several daily runs so a missed
  # draw is picked up on its own (2026-10-16: no draw-day run fired, the board kept 1 Oct).
  schedule:
    - cron: "7,22,37,52 7-13 1,2,16,17,30,31 * *" # วันออกรางวัล(+วันถัดไป) 14:00-20:59 น. ไทย ทุก 15 นาที
    - cron: "43 0,5,11,17 * * *"                  # วันอื่น 4 ครั้งต่อวัน (07:43, 12:43, 18:43, 00:43 น. ไทย)

permissions:
  contents: write

concurrency:
  group: fetch-lotto
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run fetcher
        run: node scripts/fetch-lotto.js

      - name: Commit & push if changed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/lotto)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add data/lotto
            git commit -m "chore: update lottery $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "No changes."
          fi
