name: Fetch chain + BTC price

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *" # ทุก 5 นาที (GitHub อาจดีเลย์บ้างตอนคนใช้เยอะ)

permissions:
  contents: write

concurrency:
  group: fetch-chain
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run fetcher
        run: node scripts/fetch-chain.js

      - name: Commit & push if changed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain data/chain.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add data/chain.json
            git commit -m "chore: update chain $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "No changes."
          fi
